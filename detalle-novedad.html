<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitShop | Detalle de novedad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top barra-navegacion">
    <div class="container">
      <a class="navbar-brand marca-nav" href="index.html"><img src="img/logo-fitshop.png" alt="Logo FitShop" class="logo-nav" width="48" height="48"><span>FitShop</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir el menú de navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-principal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="tienda.html">Tienda</a></li>
          <li class="nav-item"><a class="nav-link" href="novedades.html" aria-current="page">Novedades</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#sobre-nosotros">Sobre nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Entrar</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito <span class="badge rounded-pill bg-fitshop ms-1 d-none" data-contador-carrito>0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <nav class="mb-3"><a href="novedades.html">← Volver a novedades</a></nav>
    <div class="row g-4">
      <div class="col-12 col-md-5">
        <img id="foto" src="" alt="" class="img-fluid border rounded bg-light p-3 w-100" style="height:380px;object-fit:contain">
      </div>
      <div class="col-12 col-md-7">
        <span class="badge bg-fitshop mb-2" id="etiqueta"></span>
        <h1 class="h2" id="nombre"></h1>
        <p class="mb-3">
          <span id="antes" class="text-decoration-line-through text-secondary me-2"></span>
          <strong class="fs-3 text-fitshop" id="precio"></strong>
        </p>
        <p class="text-secondary" id="descripcion"></p>
        <h2 class="h5 mt-4">¿Qué incluye?</h2>
        <ul id="incluye" class="list-group list-group-flush mb-4"></ul>
        <button type="button" class="btn btn-fitshop btn-lg fw-bold" id="anadir-pack">Añadir al carrito</button>
      </div>
    </div>
  </main>


  <footer class="pie-pagina">
    <div class="container">
    <div class="pie-contenido">
      <a class="pie-marca" href="index.html"><img src="img/logo-fitshop.png" alt="Logo FitShop"><span>FitShop</span></a>
      <nav class="pie-enlaces" aria-label="Enlaces del pie de página">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html">Tienda</a></li>
          <li><a href="novedades.html">Novedades</a></li>
          <li><a href="index.html#sobre-nosotros">Sobre nosotros</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
    <p class="pie-copy">© 2026 FitShop · Nutrición para cada entrenamiento</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script>
    // Lee el id de la URL y muestra la novedad elegida
    const n = buscarNovedad(getParam('id'));
    document.title = 'FitShop | ' + n.nombre;
    document.querySelector('#foto').src = n.imagen;
    document.querySelector('#foto').alt = n.nombre;
    document.querySelector('#etiqueta').textContent = n.etiqueta;
    document.querySelector('#nombre').textContent = n.nombre;
    document.querySelector('#precio').textContent = n.precio + '€';
    document.querySelector('#descripcion').textContent = n.descripcion;
    const antes = document.querySelector('#antes');
    if (n.antes > n.precio) { antes.textContent = n.antes + '€'; } else { antes.remove(); }
    const lista = document.querySelector('#incluye');
    n.incluye.forEach(item => {
      const li = document.createElement('li');
      li.className = 'list-group-item';
      li.textContent = item;
      lista.appendChild(li);
    });

    // Añade el pack al carrito y avisa con un toast
    document.querySelector('#anadir-pack').addEventListener('click', () => {
      agregarAlCarrito(n, 1);
      notificar(`${n.nombre} añadido al carrito`);
    });
  </script>
  <script src="js/carrito.js"></script>
</body>
</html>
