<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitShop | Detalle de novedad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="barra-navegacion">
    <a href="index.html" class="marca-nav"><img src="Logotipo deportivo FitShop con mancuerna.png" alt="Logo FitShop" class="logo-nav"><span>FitShop</span></a>
    <ul class="enlaces-nav">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="tienda.html">Tienda</a></li>
      <li><a href="novedades.html" aria-current="page">Novedades</a></li>
      <li><a href="login.html">Entrar</a></li>
    </ul>
  </nav>

  <main class="container py-5">
    <nav class="mb-3"><a href="novedades.html">← Volver a novedades</a></nav>
    <div class="row g-4">
      <div class="col-12 col-md-5">
        <img id="foto" src="" alt="" class="img-fluid border rounded bg-light p-3 w-100" style="height:380px;object-fit:contain">
      </div>
      <div class="col-12 col-md-7">
        <span class="badge bg-fitshop mb-2" id="etiqueta"></span>
        <h1 class="h2" id="nombre"></h1>
        <p class="mb-3">
          <span id="antes" class="text-decoration-line-through text-secondary me-2"></span>
          <strong class="fs-3 text-fitshop" id="precio"></strong>
        </p>
        <p class="text-secondary" id="descripcion"></p>
        <h2 class="h5 mt-4">¿Qué incluye?</h2>
        <ul id="incluye" class="list-group list-group-flush mb-4"></ul>
        <button type="button" class="btn btn-fitshop btn-lg fw-bold" data-bs-toggle="modal" data-bs-target="#modalCompra">Comprar pack</button>
      </div>
    </div>
  </main>

  <!-- Modal que avisa de la compra -->
  <div class="modal fade" id="modalCompra" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">¡Compra realizada!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">Gracias por tu compra. Esto es una demostración, no se ha realizado ningún cobro.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir mirando</button>
          <a href="index.html" class="btn btn-fitshop fw-bold">Ir al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="pie-pagina">© 2026 FitShop · Nutrición para cada entrenamiento</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="productos.js"></script>
  <script>
    // Lee el id de la URL y muestra la novedad elegida
    const n = buscarNovedad(getParam('id'));
    document.title = 'FitShop | ' + n.nombre;
    document.querySelector('#foto').src = n.imagen;
    document.querySelector('#foto').alt = n.nombre;
    document.querySelector('#etiqueta').textContent = n.etiqueta;
    document.querySelector('#nombre').textContent = n.nombre;
    document.querySelector('#precio').textContent = n.precio + '€';
    document.querySelector('#descripcion').textContent = n.descripcion;
    const antes = document.querySelector('#antes');
    if (n.antes > n.precio) { antes.textContent = n.antes + '€'; } else { antes.remove(); }
    const lista = document.querySelector('#incluye');
    n.incluye.forEach(item => {
      const li = document.createElement('li');
      li.className = 'list-group-item';
      li.textContent = item;
      lista.appendChild(li);
    });
  </script>
</body>
</html>
