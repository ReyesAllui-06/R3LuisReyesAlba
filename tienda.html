<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitShop | Tienda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top barra-navegacion">
    <div class="container">
      <a class="navbar-brand marca-nav" href="index.html"><img src="img/logo-fitshop.png" alt="Logo FitShop" class="logo-nav" width="48" height="48"><span>FitShop</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir el menú de navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-principal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="tienda.html" aria-current="page">Tienda</a></li>
          <li class="nav-item"><a class="nav-link" href="novedades.html">Novedades</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#sobre-nosotros">Sobre nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Entrar</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito <span class="badge rounded-pill bg-fitshop ms-1 d-none" data-contador-carrito>0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>
  <header class="cabecera-imagen">
    <img src="img/fitshop_cabecera_productos.png" alt="FitShop. Nuestra línea de suplementos deportivos">
  </header>
  <main class="catalogo">
    <section class="productos" id="productos">
      <h2>Productos</h2>
      <div class="escaparate" id="escaparate">
        <!-- Los productos se inyectan aquí con JavaScript -->
      </div>
    </section>
  </main>
  <footer class="pie-pagina">
    <div class="container">
    <div class="pie-contenido">
      <a class="pie-marca" href="index.html"><img src="img/logo-fitshop.png" alt="Logo FitShop"><span>FitShop</span></a>
      <nav class="pie-enlaces" aria-label="Enlaces del pie de página">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html">Tienda</a></li>
          <li><a href="novedades.html">Novedades</a></li>
          <li><a href="index.html#sobre-nosotros">Sobre nosotros</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
    <p class="pie-copy">© 2026 FitShop · Nutrición para cada entrenamiento</p>
    </div>
  </footer>
  <script src="js/productos.js"></script>
  <script>
    const contenedor = document.querySelector('#escaparate');
    PRODUCTOS.forEach(producto => {
      const tarjeta = document.createElement('article');
      tarjeta.className = 'mini-producto';
      tarjeta.innerHTML = `
        <a class="mini-producto-imagen" href="producto.html?id=${producto.id}" aria-label="Ver detalles de ${producto.nombre}">
          <img src="${producto.imagen}" alt="${producto.nombre}">
        </a>
        <p class="mini-producto-nombre"><a href="producto.html?id=${producto.id}">${producto.nombre}</a></p>
        <strong class="mini-producto-precio">${producto.precio}€</strong>
        <small>${producto.detalle}</small>
        <a class="mini-producto-boton" href="producto.html?id=${producto.id}">Ver producto</a>
      `;
      contenedor.appendChild(tarjeta);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
