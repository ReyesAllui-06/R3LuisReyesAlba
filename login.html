<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitShop | Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="barra-navegacion">
    <a href="index.html" class="marca-nav"><img src="Logotipo deportivo FitShop con mancuerna.png" alt="Logo FitShop" class="logo-nav"><span>FitShop</span></a>
    <ul class="enlaces-nav">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="tienda.html">Tienda</a></li>
      <li><a href="novedades.html">Novedades</a></li>
      <li><a href="registro.html">Crear cuenta</a></li>
    </ul>
  </nav>

  <!-- Formulario de inicio de sesión con Bootstrap -->
  <main class="container py-5" style="max-width: 450px;">
    <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>
    <form id="form-login" class="card shadow-sm p-4 border-0">
      <div class="mb-3">
        <label class="form-label fw-bold">Correo electrónico</label>
        <input type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Contraseña</label>
        <input type="password" class="form-control" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="recordar">
        <label class="form-check-label" for="recordar">Recordarme</label>
      </div>
      <button type="submit" class="btn btn-fitshop w-100 fw-bold">Entrar</button>
      <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </form>
  </main>

  <!-- Modal de aviso de inicio de sesión -->
  <div class="modal fade" id="modalAviso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">¡Bienvenido!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">Has iniciado sesión correctamente. Esto es una demostración.</div>
        <div class="modal-footer">
          <a href="index.html" class="btn btn-fitshop fw-bold">Ir al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="pie-pagina">© 2026 FitShop · Nutrición para cada entrenamiento</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelector('#form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      new bootstrap.Modal(document.querySelector('#modalAviso')).show();
    });
  </script>
</body>
</html>
