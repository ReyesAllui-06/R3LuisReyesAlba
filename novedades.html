<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitShop | Novedades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="barra-navegacion">
    <a href="index.html" class="marca-nav"><img src="img/logo-fitshop.png" alt="Logo FitShop" class="logo-nav"><span>FitShop</span></a>
    <ul class="enlaces-nav">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="tienda.html">Tienda</a></li>
      <li><a href="novedades.html" aria-current="page">Novedades</a></li>
      <li><a href="index.html#sobre-nosotros">Sobre nosotros</a></li>
      <li><a href="login.html">Entrar</a></li>
    </ul>
  </nav>

  <main class="container py-5">
    <h1 class="h2 mb-2">Novedades y promociones</h1>
    <p class="text-secondary mb-4">Packs y nuevos productos con precios especiales.</p>

    <!-- Las tarjetas de novedades se crean con JavaScript usando Bootstrap -->
    <div class="row g-4" id="rejilla-novedades"></div>
  </main>

  <footer class="pie-pagina">© 2026 FitShop · Nutrición para cada entrenamiento</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script>
    const rejilla = document.querySelector('#rejilla-novedades');
    NOVEDADES.forEach(n => {
      const col = document.createElement('div');
      col.className = 'col-12 col-md-6 col-lg-4';
      const oferta = n.antes > n.precio
        ? `<span class="text-decoration-line-through text-secondary me-2">${n.antes}€</span>`
        : '';
      col.innerHTML = `
        <div class="card h-100 shadow-sm border-0">
          <span class="badge bg-fitshop position-absolute m-2">${n.etiqueta}</span>
          <img src="${n.imagen}" class="card-img-top p-3" style="height:220px;object-fit:contain;background:#f7f7f7" alt="${n.nombre}">
          <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">${n.nombre}</h2>
            <p class="card-text text-secondary small flex-grow-1">${n.descripcion}</p>
            <p class="mb-3">${oferta}<strong class="fs-5 text-fitshop">${n.precio}€</strong></p>
            <a href="detalle-novedad.html?id=${n.id}" class="btn btn-fitshop fw-bold mt-auto">Ver detalle</a>
          </div>
        </div>`;
      rejilla.appendChild(col);
    });
  </script>
</body>
</html>
