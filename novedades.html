<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitShop | Novedades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="barra-navegacion">
    <a href="index.html" class="marca-nav"><img src="img/logo-fitshop.png" alt="Logo FitShop" class="logo-nav"><span>FitShop</span></a>
    <ul class="enlaces-nav">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="tienda.html">Tienda</a></li>
      <li><a href="novedades.html" aria-current="page">Novedades</a></li>
      <li><a href="index.html#sobre-nosotros">Sobre nosotros</a></li>
      <li><a href="login.html">Entrar</a></li>
    </ul>
  </nav>

  <main>
    <section class="cabecera-seccion">
      <h1>Novedades y promociones</h1>
      <p>Packs y nuevos productos con precios especiales.</p>
    </section>

    <div class="pagina-novedades">
      <!-- Las tarjetas de novedades se crean con JavaScript usando Bootstrap -->
      <div class="row g-4" id="rejilla-novedades"></div>
    </div>
  </main>

  <footer class="pie-pagina">
    <div class="pie-contenido">
      <a class="pie-marca" href="index.html"><img src="img/logo-fitshop.png" alt="Logo FitShop"><span>FitShop</span></a>
      <nav class="pie-enlaces" aria-label="Enlaces del pie de página">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html">Tienda</a></li>
          <li><a href="novedades.html">Novedades</a></li>
          <li><a href="index.html#sobre-nosotros">Sobre nosotros</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
    <p class="pie-copy">© 2026 FitShop · Nutrición para cada entrenamiento</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/productos.js"></script>
  <script>
    const rejilla = document.querySelector('#rejilla-novedades');
    NOVEDADES.forEach(n => {
      const col = document.createElement('div');
      col.className = 'col-12 col-md-6 col-lg-4';
      const oferta = n.antes > n.precio
        ? `<span class="text-decoration-line-through text-secondary">${n.antes}€</span>`
        : '';
      col.innerHTML = `
        <article class="card h-100 novedad">
          <span class="badge bg-fitshop position-absolute m-3">${n.etiqueta}</span>
          <img src="${n.imagen}" class="card-img-top novedad-imagen" alt="${n.nombre}">
          <div class="card-body d-flex flex-column p-4">
            <h2 class="card-title">${n.nombre}</h2>
            <p class="card-text flex-grow-1">${n.descripcion}</p>
            <p class="novedad-precio">${oferta}<strong class="text-fitshop">${n.precio}€</strong></p>
            <a href="detalle-novedad.html?id=${n.id}" class="btn btn-fitshop w-100 mt-auto">Ver detalle</a>
          </div>
        </article>`;
      rejilla.appendChild(col);
    });
  </script>
</body>
</html>
